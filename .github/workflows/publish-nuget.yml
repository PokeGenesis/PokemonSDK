name: Publish NuGet

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build PokemonSDK.slnx --configuration Release

      - name: Run all tests
        run: dotnet test PokemonSDK.slnx --configuration Release --no-build

      - name: Pack packages disponibles
        run: |
          dotnet pack src/SDK.Core --configuration Release -o ./nupkg
          dotnet pack src/SDK.Data --configuration Release -o ./nupkg
          # TODO: Phase 2 — dotnet pack src/SDK.Battle
          # TODO: Phase 4 — dotnet pack src/SDK.Scripting
          # TODO: Phase 5 — dotnet pack src/SDK.Plugins.Nuzlocke
          # TODO: Phase 5 — dotnet pack src/SDK.Plugins.Randomizer
          # TODO: Phase 5 — dotnet pack src/SDK.Plugins.Turbo

      - name: Push vers NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY non configuré — push ignoré (Phase 8 DX-03)"
            exit 0
          fi
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: ./nupkg
