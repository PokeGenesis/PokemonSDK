name: CI DEV + Promote → STAGING

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PokemonSDK.slnx

      - name: Build
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build PokemonSDK.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PokemonSDK.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"

      - name: Validate SDK.Core — zéro dépendance NuGet
        run: dotnet list src/SDK.Core/SDK.Core.csproj package

      - name: Headless smoke test
        run: dotnet run --project src/SDK.MonoGame --configuration Release -- --headless --max-frames=10
        continue-on-error: true

      - name: Promote dev → staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B staging origin/staging
          git merge --no-ff origin/dev -X theirs \
            -m "chore(gitflow): auto-promote dev → staging [CI vert @ ${{ github.sha }}]"
          git push origin staging
