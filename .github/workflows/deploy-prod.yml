name: Deploy PROD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build + Test (filet de sécurité final)
        run: |
          dotnet build PokemonSDK.slnx --configuration Release
          dotnet test PokemonSDK.slnx --configuration Release --no-build

      # TODO: Phase 3 — remplacer par SDK.MonoGame quand disponible
      - name: Publish SDK.Tools PROD
        run: |
          dotnet publish src/SDK.Tools/SDK.Tools.csproj \
            --configuration Release \
            --output ./publish/prod

      # TODO: Phase 8 — activer pour les releases NuGet officielles
      # - name: Create GitHub Release
      #   uses: actions/create-release@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ github.ref_name }}
      #     release_name: PokemonSDK ${{ github.ref_name }}
      #     draft: false
      #     prerelease: false

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokemonsdk-prod-${{ github.sha }}
          path: ./publish/prod
