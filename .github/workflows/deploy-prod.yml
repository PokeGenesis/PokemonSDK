name: Deploy PROD + Sync branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-and-sync:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build + Test (filet de sécurité final)
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          dotnet build PokemonSDK.slnx --configuration Release
          dotnet test PokemonSDK.slnx --configuration Release --no-build

      - name: Publish SDK.Tools PROD
        run: |
          dotnet publish src/SDK.Tools/SDK.Tools.csproj \
            --configuration Release \
            --no-build \
            --output ./publish/prod

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: pokemonsdk-prod-${{ github.sha }}
          path: ./publish/prod

      - name: Sync main → staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B staging origin/staging
          git merge --no-ff origin/main -X ours \
            -m "chore(gitflow): sync staging ← main [skip ci]"
          git push origin staging

      - name: Sync main → dev
        run: |
          git checkout -B dev origin/dev
          git merge --no-ff origin/main -X ours \
            -m "chore(gitflow): sync dev ← main [skip ci]"
          git push origin dev
